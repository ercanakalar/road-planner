services:
    backend:
        build:
            context: ./backend
            target: development
        image: ercanakalar/road-map-backend
        container_name: road-map-backend
        ports:
            - '3000:3000'
        env_file:
            - path: ./backend/.env
              required: false
        environment:
            NODE_ENV: development
        volumes:
            - ./backend:/app
            - backend-uploads:/app/uploads
            - /app/node_modules
        command: npm run start:dev

    test-db:
        image: postgres:16
        container_name: road-map-db
        ports:
            - '5434:5432'
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-roaddb}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-road-map}
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
            interval: 5s
            timeout: 5s
            retries: 10
        volumes:
            - road-map-db:/var/lib/postgresql/data

    mobile:
        build:
            context: ./mobile-react-native
        image: ercanakalar/road-map-mobile
        container_name: road-map-mobile
        depends_on:
            - backend
        ports:
            - '8081:8081'
            - '19000:19000'
            - '19001:19001'
            - '19002:19002'
        environment:
            EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
            # This machine's LAN IP. The phone is a real device outside Docker's
            # network, so it must reach `backend` at the host's address and the
            # port mapping above (3000:3000) — the container name `backend` only
            # resolves inside the compose network, not from the phone. Update
            # both this and EXPO_PUBLIC_BASE_URL below if the machine's IP
            # changes (a different network, a new DHCP lease, etc).
            REACT_NATIVE_PACKAGER_HOSTNAME: 
            EXPO_PUBLIC_BASE_URL: http://:3000
        volumes:
            - ./mobile-react-native:/app
            - /app/node_modules
        stdin_open: true
        tty: true
        command: npx expo start --tunnel

volumes:
    road-map-db:
    backend-uploads:
