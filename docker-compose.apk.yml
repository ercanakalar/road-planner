services:
    build-apk:
        build:
            context: ./mobile-react-native
            dockerfile: Dockerfile.android
        image: road-planner-android-builder
        environment:
            BUILD_TYPE: ${BUILD_TYPE:-release}
        env_file:
            - ./mobile-react-native/.env
        volumes:
            - ./mobile-react-native:/app
            - apk-keystore:/keystore
            - ./apk-output:/output
            - apk-gradle-cache:/gradle-cache

    logcat:
        build:
            context: ./mobile-react-native
            dockerfile: Dockerfile.android
        image: road-planner-android-builder
        entrypoint: /usr/local/bin/android-logcat
        environment:
            ADB_TARGET: ${ADB_TARGET:-}
            ADB_PAIR: ${ADB_PAIR:-}
            PAIR_CODE: ${PAIR_CODE:-}
        volumes:
            - ./apk-output:/output

volumes:
    apk-keystore:
    apk-gradle-cache:
