<main class="mx-auto flex min-h-dvh max-w-md flex-col justify-center gap-5 px-4 py-16 text-center">
  <h1 class="text-2xl font-bold leading-tight">{{ copy().title }}</h1>
  <p class="text-muted dark:text-muted-dark">{{ copy().body }}</p>

  <a
    [href]="appLink()"
    class="rounded-full bg-brand px-5 py-3 font-semibold text-white
           dark:bg-brand-dark dark:text-[#202124]">
    {{ copy().open }}
  </a>
  <a
    [href]="playStoreUrl"
    class="rounded-full border border-line px-5 py-3 font-semibold text-brand
           dark:border-line-dark dark:text-brand-dark">
    {{ copy().get }}
  </a>
</main>
